# Adds PostgreSQL to the base compose file, for deployments that maintain the
# dataset centrally or run more than one instance.
#
#     docker compose -f compose.yaml -f compose.postgres.yaml up
#
# The image contains no bank data. Here the "data" service of the base file
# downloads the registries from their official publishers straight into the
# database instead of into a file, and exits. Run it again at any time to
# refresh the data without touching the service:
#
#     docker compose -f compose.yaml -f compose.postgres.yaml run --rm data
#
# This is an override rather than a profile because both variants would
# otherwise publish the same port and collide.

services:
  iban:
    environment:
      IBAN_PIZZA_DATABASE_URL: postgres://ibanpizza:ibanpizza@db:5432/ibanpizza?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  data:
    environment:
      IBAN_PIZZA_DATABASE_URL: postgres://ibanpizza:ibanpizza@db:5432/ibanpizza?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ibanpizza
      POSTGRES_PASSWORD: ibanpizza
      POSTGRES_DB: ibanpizza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibanpizza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
