# The service behind iban.pizza, on any host, with no open inbound port.
#
# cloudflared opens an outbound connection to Cloudflare and exposes the
# service on a hostname you choose in the tunnel's configuration, for
# example api.iban.pizza. The iban.pizza site rewrites its API paths to that
# hostname, so the site and the API share one origin.
#
#     TUNNEL_TOKEN=... docker compose -f deploy/cloudflare-tunnel/compose.yaml up -d
#
# Create the tunnel once in the Cloudflare dashboard (Zero Trust, Networks,
# Tunnels), point its public hostname at http://iban-pizza:8080, and copy the
# token it shows. The token is the only secret and never needs to change when
# the image is updated.

# The image contains no bank data. The "data" service downloads the registries
# from their official publishers into a volume on the first start. Refresh
# with:
#
#     docker compose -f deploy/cloudflare-tunnel/compose.yaml run --rm data
#     docker compose -f deploy/cloudflare-tunnel/compose.yaml restart iban-pizza

services:
  data:
    image: ghcr.io/iban-pizza/iban-pizza:0.3.0
    command: ["update", "-allow-partial", "-log-format", "json"]
    volumes:
      - bankdata:/data
    restart: "no"

  iban-pizza:
    image: ghcr.io/iban-pizza/iban-pizza:0.3.0
    volumes:
      - bankdata:/data
    depends_on:
      data:
        condition: service_completed_successfully
    # Not published on the host. Only cloudflared, on the same network, can
    # reach it.
    expose:
      - "8080"
    environment:
      IBAN_PIZZA_LOG_FORMAT: json
      # The site's host sets x-real-ip to the visitor's address on the
      # rewritten request; the service rate limits per address, so without
      # this every visitor would share the proxy's address and one limit.
      IBAN_PIZZA_TRUSTED_PROXY_HEADER: x-real-ip
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN to the token from the Cloudflare dashboard}
    depends_on:
      - iban-pizza
    restart: unless-stopped

volumes:
  bankdata:
