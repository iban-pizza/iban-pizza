# iban.pizza on Kubernetes, standalone.
#
# The bank data is compiled into the image, so this needs no volume, no
# database and no init container. Apply it and the service answers.
#
#     kubectl apply -f deploy/kubernetes/deployment.yaml
#
# Pin the image tag to a release rather than "latest" in anything you keep.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iban-pizza
  labels:
    app.kubernetes.io/name: iban-pizza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iban-pizza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iban-pizza
    spec:
      # The image runs as 65534 already; stating it here makes the pod
      # security admission controller happy and stops anyone overriding it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iban-pizza
          image: ghcr.io/netzfabrikcom/iban-pizza:0.1.0
          args: ["serve", "-addr", ":8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Cross origin access is closed by default. Set the origins your
            # frontend is served from, or "*" for any.
            - name: OPENIBAN_CORS_ORIGINS
              value: ""
            - name: OPENIBAN_LOG_FORMAT
              value: json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readyz fails until bank data is loaded, which with the embedded
          # snapshot is immediate. healthz stays 200 while the service can
          # answer at all; stale data is reported in its body, not as a
          # failure, so old data does not take a working pod out of rotation.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: iban-pizza
  labels:
    app.kubernetes.io/name: iban-pizza
spec:
  selector:
    app.kubernetes.io/name: iban-pizza
  ports:
    - name: http
      port: 80
      targetPort: http
