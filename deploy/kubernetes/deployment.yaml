# iban.pizza on Kubernetes, standalone.
#
# The image contains no bank data: every registry has its own terms of use,
# so the data is downloaded where it is used. An init container fetches it
# into a volume and the service starts on the result. Each publisher's terms
# apply to what you download; "iban-pizza sources" lists them.
#
#     kubectl apply -f deploy/kubernetes/deployment.yaml
#
# The data is fetched when a pod starts, so restart the Deployment to refresh
# it:
#
#     kubectl rollout restart deployment/iban-pizza
#
# Pin the image tag to a release rather than "latest" in anything you keep.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iban-pizza
  labels:
    app.kubernetes.io/name: iban-pizza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iban-pizza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iban-pizza
    spec:
      # The image runs as 65534 already; stating it here makes the pod
      # security admission controller happy and stops anyone overriding it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # The image contains no bank data. This downloads the registries from
      # their official publishers into the pod's data volume before the
      # service starts, so the namespace must allow that egress. Every pod
      # fetches its own copy; with many replicas, or to control when the data
      # changes, use the PostgreSQL variant in postgres.yaml instead.
      initContainers:
        - name: data
          image: ghcr.io/iban-pizza/iban-pizza:0.3.0
          args: ["update", "-allow-partial", "-log-format", "json"]
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: iban-pizza
          image: ghcr.io/iban-pizza/iban-pizza:0.3.0
          args: ["serve", "-addr", ":8080"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          env:
            # Cross origin access is closed by default. Set the origins your
            # frontend is served from, or "*" for any.
            - name: IBAN_PIZZA_CORS_ORIGINS
              value: ""
            - name: IBAN_PIZZA_LOG_FORMAT
              value: json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readyz fails until bank data is loaded. healthz stays 200 while the service can
          # answer at all; stale data is reported in its body, not as a
          # failure, so old data does not take a working pod out of rotation.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: iban-pizza
  labels:
    app.kubernetes.io/name: iban-pizza
spec:
  selector:
    app.kubernetes.io/name: iban-pizza
  ports:
    - name: http
      port: 80
      targetPort: http
