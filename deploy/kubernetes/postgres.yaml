# iban.pizza on Kubernetes with PostgreSQL.
#
# For deployments that keep one copy of the data for every replica and refresh
# it on a schedule. Apply after deployment.yaml; this file overrides the
# Deployment to point at the database and adds a loader.
#
#     kubectl apply -f deploy/kubernetes/deployment.yaml
#     kubectl apply -f deploy/kubernetes/postgres.yaml
#
# It assumes a PostgreSQL reachable as "postgres" in the same namespace. Bring
# your own; a database operator or managed service is the right tool, and a
# throwaway one is easy to add for a trial.
apiVersion: v1
kind: Secret
metadata:
  name: iban-pizza-db
type: Opaque
stringData:
  # Change this. It is the whole connection string, so it carries the
  # password and belongs in a Secret rather than a ConfigMap.
  url: postgres://iban-pizza:changeme@postgres:5432/ibanpizza?sslmode=disable
---
# Downloads the registries from their official publishers into the database.
# The image contains no bank data, so this is what fills it, and only this
# job needs egress: the service pods never contact a publisher. Each
# publisher's terms apply to what is downloaded; "iban-pizza sources" lists
# them.
#
# A CronJob waits for its schedule, so run it once by hand after applying:
#
#     kubectl create job --from=cronjob/iban-pizza-loader sync-now
#
# To keep egress out of the cluster altogether, run "iban-pizza update" on a
# machine that may reach the publishers and load the resulting file here with
# "iban-pizza import -snapshot <file>".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iban-pizza-loader
spec:
  # Weekly. The registries change at different rates, from daily to quarterly,
  # and a weekly download is polite to all of them.
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: loader
              image: ghcr.io/iban-pizza/iban-pizza:0.3.0
              args: ["update", "-allow-partial", "-log-format", "json"]
              env:
                - name: IBAN_PIZZA_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: iban-pizza-db
                      key: url
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# The same Deployment as in deployment.yaml, reading from the database.
#
# This is a complete copy rather than a patch. A partial Deployment does not
# merge reliably under plain "kubectl apply", and the point of these files is
# that they work with one command and no extra tooling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iban-pizza
  labels:
    app.kubernetes.io/name: iban-pizza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: iban-pizza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iban-pizza
    spec:
      # The image runs as 65534 already; stating it here makes the pod
      # security admission controller happy and stops anyone overriding it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iban-pizza
          image: ghcr.io/iban-pizza/iban-pizza:0.3.0
          args: ["serve", "-addr", ":8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Cross origin access is closed by default. Set the origins your
            # frontend is served from, or "*" for any.
            - name: IBAN_PIZZA_CORS_ORIGINS
              value: ""
            - name: IBAN_PIZZA_LOG_FORMAT
              value: json
            - name: IBAN_PIZZA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iban-pizza-db
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readyz fails until bank data is loaded. healthz stays 200 while the service can
          # answer at all; stale data is reported in its body, not as a
          # failure, so old data does not take a working pod out of rotation.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
