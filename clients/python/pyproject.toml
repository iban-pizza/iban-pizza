[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iban-pizza"
version = "0.1.0"
description = "Client for the iban.pizza API: IBAN validation, bank lookup and SEPA scheme membership."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://iban.pizza"
Repository = "https://github.com/iban-pizza/iban-pizza"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["iban_pizza*"]

[tool.setuptools.package-data]
iban_pizza = ["py.typed"]
