name: Publish clients

# Client releases are cut by tag, independently of the service:
#
#     git tag js-v0.1.0 && git push origin js-v0.1.0     -> npm
#     git tag py-v0.1.0 && git push origin py-v0.1.0     -> PyPI
#
# npm needs the repository secret NPM_TOKEN (an automation token). PyPI uses
# trusted publishing: register this repository and workflow as a publisher for
# the project on pypi.org, and no token is needed at all.
on:
  push:
    tags: ['js-v*', 'py-v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: startsWith(github.ref_name, 'js-v')
    name: npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - name: The tag must match package.json
        run: |
          want="${GITHUB_REF_NAME#js-v}"
          have=$(node -p "require('./package.json').version")
          [ "$want" = "$have" ] || { echo "tag says $want, package.json says $have"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'py-v')
    name: PyPI
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: The tag must match pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#py-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag says $want, pyproject.toml says $have"; exit 1; }

      - run: python -m pip install -q build pytest && python -m pip install -q -e . && python -m pytest -q
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
