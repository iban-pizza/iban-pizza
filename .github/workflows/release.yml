name: Release

# Tagging is the trigger. Pushing "v1.2.3" builds the binaries, publishes the
# container image and creates the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for a rerun
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Test before releasing
        run: go test ./... -count=1

      - name: Resolve the version
        id: version
        run: echo "version=${GITHUB_REF_NAME:-${{ inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # CGO stays off so each binary is static and runs anywhere.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="iban-pizza_${VERSION}_${os}_${arch}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            echo "Building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}${ext}" \
              ./cmd/iban-pizza
          done

          cd dist
          # One checksum file covering every artefact, so a download can be
          # verified without trusting the transfer.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Container image:

                docker pull ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}

            Every binary is static and needs no runtime dependency. The bank
            data snapshot is compiled in, so the service answers immediately
            with no configuration. Refresh the data with:

                iban-pizza update --write-snapshot internal/embedded/snapshot.jsonl.gz

            Verify a download against SHA256SUMS before running it.

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # A software bill of materials and provenance attestation ship with
          # the image, so its contents can be audited after the fact.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event.repository.private == false
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        # Keyless signing binds the signature to this workflow run rather than
        # to a key someone has to store and rotate.
        #
        # It is skipped while the repository is private. Keyless signing writes
        # to the public Rekor transparency log, and the entry names the
        # repository and workflow path. That would disclose a private
        # repository's existence, so signing starts when the repository does.
        if: github.event.repository.private == false
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
          echo "Verify with:"
          echo "  cosign verify ${REGISTRY}/${IMAGE}@${DIGEST} \\"
          echo "    --certificate-identity-regexp 'https://github.com/${IMAGE}/.github/workflows/release.yml@.*' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
