name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  postgres:
    name: PostgreSQL backend
    runs-on: ubuntu-latest

    # These tests skip themselves when IBAN_PIZZA_TEST_DATABASE_URL is unset, so
    # they stay out of the way of a local "go test ./..." while still being
    # exercised on every push.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: iban
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Test the PostgreSQL backend
        env:
          IBAN_PIZZA_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/iban?sslmode=disable
        run: go test ./bankdata/postgres/ -race -count=1 -v

  clients:
    name: Client libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      # Both clients run their integration tests against a service built
      # from this very commit, so an API change that breaks a client fails
      # here and not at a user.
      - name: Build and start the service
        run: |
          CGO_ENABLED=0 go build -o /tmp/iban-pizza ./cmd/iban-pizza
          # The repository carries no bank data, and a test run must not
          # depend on the publishers being reachable. The two records the
          # client tests ask about are loaded from a hand written file.
          /tmp/iban-pizza import -country DE -format generic \
            -file cmd/iban-pizza/testdata/banks.csv -data-file /tmp/bankdata.jsonl.gz
          /tmp/iban-pizza serve -addr 127.0.0.1:8080 -log-format text \
            -data-file /tmp/bankdata.jsonl.gz &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/readyz >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8080/readyz

      - name: JavaScript client
        working-directory: clients/js
        env:
          IBAN_PIZZA_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npm run build
          npm test
          npm pack --dry-run

      - name: Python client
        working-directory: clients/python
        env:
          IBAN_PIZZA_URL: http://127.0.0.1:8080
        run: |
          python -m pip install -q build pytest
          python -m pip install -q -e .
          python -m pytest -q
          python -m build -q

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/iban-pizza ./cmd/iban-pizza

      # The binary ships without bank data. Before any is downloaded it has
      # to start anyway, validate the structure of an IBAN, and say plainly
      # that it is not ready to resolve banks.
      - name: Smoke test the start without data
        run: |
          /tmp/iban-pizza serve -addr 127.0.0.1:8081 -log-format text \
            -data-file /tmp/absent.jsonl.gz &
          pid=$!
          trap 'kill $pid' EXIT

          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/healthz >/dev/null && break
            sleep 0.5
          done

          echo "A structurally valid IBAN must still validate:"
          curl -sf http://127.0.0.1:8081/v2/iban/DE89370400440532013000 \
            | grep -q '"valid":true'

          echo "Readiness must report that no bank data is loaded:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)" = 503

      - name: Smoke test the start with data
        run: |
          /tmp/iban-pizza import -country DE -format generic \
            -file cmd/iban-pizza/testdata/banks.csv -data-file /tmp/bankdata.jsonl.gz
          /tmp/iban-pizza serve -addr 127.0.0.1:8080 -log-format text \
            -data-file /tmp/bankdata.jsonl.gz &
          pid=$!
          trap 'kill $pid' EXIT

          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.5
          done

          echo "Health:"
          curl -sf http://127.0.0.1:8080/healthz | head -c 400
          echo

          echo "Readiness:"
          curl -sf http://127.0.0.1:8080/readyz

          echo "A known IBAN must validate:"
          curl -sf "http://127.0.0.1:8080/validate/DE89370400440532013000?getBIC=true" \
            | grep -q '"bic": "COBADEFFXXX"'

          echo "The v2 surface must answer:"
          curl -sf http://127.0.0.1:8080/v2/iban/DE89370400440532013000 \
            | grep -q '"valid":true'

          echo "The spec must be served:"
          curl -sf http://127.0.0.1:8080/openapi.yaml | head -1 | grep -q '^openapi:'

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: iban-pizza:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image
        run: |
          docker run -d --name iban -p 8080:8080 iban-pizza:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.5
          done
          # The image contains no bank data, so a bare container validates
          # structure and reports that it is not ready to resolve banks.
          curl -sf http://127.0.0.1:8080/v2/iban/DE89370400440532013000 | grep -q '"valid":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = 503
          docker rm -f iban

      # The data directory has to be writable by the image's unprivileged
      # user, or "update" fails on every fresh volume. Importing the test file
      # into a volume and serving from it proves that without contacting a
      # publisher.
      - name: Load data into a volume and serve it
        run: |
          docker volume create ibandata
          docker run --rm -v ibandata:/data -v "$PWD/cmd/iban-pizza/testdata:/fixture:ro" iban-pizza:ci \
            import -country DE -format generic -file /fixture/banks.csv
          docker run -d --name iban -p 8080:8080 -v ibandata:/data iban-pizza:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8080/readyz
          docker rm -f iban
